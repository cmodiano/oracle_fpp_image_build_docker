name: Oracle 19c gold images (RDBMS + Grid)

on:
  workflow_dispatch:
    inputs:
      mrp_label:
        description: "Libellé MRP servant au nommage, ex. 19.28.0.0.250915"
        required: true
      build_rdbms:
        type: boolean
        default: true
      build_grid:
        type: boolean
        default: true
      force:
        description: "Écraser une image déjà publiée dans Artifactory"
        type: boolean
        default: false
  # Aucun numéro de patch n'est saisi : AutoUpgrade résout le jeu recommandé des deux côtés.
  # Un déclenchement mensuel (cron) ne demanderait donc qu'à dériver mrp_label.

concurrency:
  group: oracle-gold-${{ inputs.mrp_label }}
  cancel-in-progress: false

env:
  ARTIFACTORY_URL: ${{ vars.ARTIFACTORY_URL }}      # ex. https://artifactory.example.com/artifactory
  ARTIFACTORY_REPO: ${{ vars.ARTIFACTORY_REPO }}    # dépôt Generic des gold images
  BASE_IMAGES_REPO: ${{ vars.BASE_IMAGES_REPO }}    # zip 19.3 Grid
  TOOLS_REPO: ${{ vars.TOOLS_REPO }}                # autoupgrade.jar
  CONTAINER_TAG: ${{ vars.CONTAINER_REGISTRY }}/dbops/oracle-build-base:ubi8-19c
  WORK_ROOT: /u01/gha

jobs:
  build-rdbms:
    if: ${{ inputs.build_rdbms }}
    runs-on: [self-hosted, linux, oracle-build]
    timeout-minutes: 180
    container:
      image: ${{ vars.CONTAINER_REGISTRY }}/dbops/oracle-build-base:ubi8-19c
      credentials:
        username: ${{ vars.ARTIFACTORY_USER }}
        password: ${{ secrets.ARTIFACTORY_TOKEN }}
      options: --user 54321:54321
    outputs:
      version: ${{ steps.built.outputs.version }}
    env:
      MRP_LABEL: ${{ inputs.mrp_label }}
      ORACLE_BASE: /u01/app/oracle
      ORACLE_HOME: /u01/app/oracle/product/19.0.0/dbhome_1
      JOB_ROOT: /u01/gha/rdbms
    steps:
      - uses: actions/checkout@v4

      - name: Espace disque (avant)
        run: df -h /u01

      - name: Préparer l'espace de travail
        run: |
          set -euo pipefail
          mkdir -p "$JOB_ROOT/patches" "$JOB_ROOT/gold" "$JOB_ROOT/logs" "$JOB_ROOT/tools"

      - name: Récupérer autoupgrade.jar
        env:
          ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
        run: |
          set -euo pipefail
          scripts/fetch_base.sh --repo "$TOOLS_REPO" \
            --path "autoupgrade/${{ vars.AUTOUPGRADE_VERSION }}/autoupgrade.jar" \
            --dest "$JOB_ROOT/tools/autoupgrade.jar"

      - name: Générer la config AutoUpgrade
        run: |
          set -euo pipefail
          sed -e "s|@@PATCH_DIR@@|$JOB_ROOT/patches|" \
              -e "s|@@LOG_DIR@@|$JOB_ROOT/logs|" \
              -e "s|@@KEYSTORE@@|$JOB_ROOT/keystore|" \
              -e "s|@@TARGET_HOME@@|$ORACLE_HOME|" \
              -e "s|@@GOLD_ZIP@@|db_${MRP_LABEL}.zip|" \
              config/autoupgrade-db.cfg > "$JOB_ROOT/patch.cfg"
          cat "$JOB_ROOT/patch.cfg"

      - name: Créer le keystore MOS
        env:
          MOS_USER: ${{ secrets.MOS_USER }}
          MOS_PASS: ${{ secrets.MOS_PASS }}
        run: |
          set -euo pipefail
          scripts/mos_keystore.sh \
            --jar "$JOB_ROOT/tools/autoupgrade.jar" \
            --config "$JOB_ROOT/patch.cfg" \
            --keystore "$JOB_ROOT/keystore"

      # Aucun numéro de patch : AutoUpgrade résout le jeu recommandé du mois.
      - name: Construire le home patché et le gold image
        run: |
          set -euo pipefail
          scripts/build_rdbms_autoupgrade.sh \
            --jar "$JOB_ROOT/tools/autoupgrade.jar" \
            --config "$JOB_ROOT/patch.cfg" \
            --patch-dir "$JOB_ROOT/patches" \
            --target-home "$ORACLE_HOME" \
            --gold-dir "$JOB_ROOT/gold" \
            --gold-name "db_${MRP_LABEL}.zip"

      - name: Version construite
        id: built
        run: |
          set -euo pipefail
          VERSION=$(tr -d '[:space:]' < "$JOB_ROOT/gold/version.txt")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ru=$(echo "$VERSION" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"

      - name: Vérifier le gold image et produire le manifeste
        run: |
          set -euo pipefail
          scripts/verify_gold_image.sh \
            --zip "$JOB_ROOT/gold/db_${MRP_LABEL}.zip" \
            --type rdbms \
            --mrp "${MRP_LABEL}" \
            --lspatches "$JOB_ROOT/gold/lspatches.txt" \
            --version-file "$JOB_ROOT/gold/version.txt" \
            --base-source "oua-gold-image" \
            --container-tag "$CONTAINER_TAG" \
            --out "$JOB_ROOT/gold/db_${MRP_LABEL}.manifest.json"

      - name: Publier dans Artifactory
        env:
          ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
          FORCE: ${{ inputs.force }}
          RU: ${{ steps.built.outputs.ru }}
        run: |
          set -euo pipefail
          BASE="rdbms/19/${RU}/db_${MRP_LABEL}"
          PROPS="type=ORACLEDBSOFTWARE;ru=${RU};mrp=${MRP_LABEL};commit=$GITHUB_SHA;run=$GITHUB_RUN_ID"
          scripts/publish_artifactory.sh "$JOB_ROOT/gold/db_${MRP_LABEL}.zip"           "$BASE.zip"           "$PROPS"
          scripts/publish_artifactory.sh "$JOB_ROOT/gold/lspatches.txt"                 "$BASE.lspatches.txt" "$PROPS"
          scripts/publish_artifactory.sh "$JOB_ROOT/gold/db_${MRP_LABEL}.manifest.json" "$BASE.manifest.json" "$PROPS"

      - name: Résumé RDBMS
        env:
          RU: ${{ steps.built.outputs.ru }}
          VERSION: ${{ steps.built.outputs.version }}
        run: |
          set -euo pipefail
          SHA=$(sha256sum "$JOB_ROOT/gold/db_${MRP_LABEL}.zip" | awk '{print $1}')
          {
            echo "### RDBMS — db_${MRP_LABEL}.zip"
            echo "- version construite : \`$VERSION\`"
            echo "- URL : $ARTIFACTORY_URL/$ARTIFACTORY_REPO/rdbms/19/${RU}/db_${MRP_LABEL}.zip"
            echo "- sha256 : \`$SHA\`"
            echo '```bash'
            echo "rhpctl import image -image db_$(echo "$MRP_LABEL" | tr . _) \\"
            echo "  -zip /fpp/staging/db_${MRP_LABEL}.zip -imagetype ORACLEDBSOFTWARE -series db19"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Espace disque (après)
        if: always()
        run: df -h /u01

  build-grid:
    if: ${{ inputs.build_grid }}
    runs-on: [self-hosted, linux, oracle-build]
    timeout-minutes: 180
    container:
      image: ${{ vars.CONTAINER_REGISTRY }}/dbops/oracle-build-base:ubi8-19c
      credentials:
        username: ${{ vars.ARTIFACTORY_USER }}
        password: ${{ secrets.ARTIFACTORY_TOKEN }}
      options: --user 54322:54321
    outputs:
      version: ${{ steps.built.outputs.version }}
    env:
      MRP_LABEL: ${{ inputs.mrp_label }}
      GRID_HOME: /u01/app/19.0.0/grid
      JOB_ROOT: /u01/gha/grid
    steps:
      - uses: actions/checkout@v4

      - name: Espace disque (avant)
        run: df -h /u01

      - name: Préparer l'espace de travail
        run: |
          set -euo pipefail
          mkdir -p "$JOB_ROOT/patches" "$JOB_ROOT/gold" "$JOB_ROOT/base" "$JOB_ROOT/logs" "$JOB_ROOT/tools"

      - name: Récupérer le zip Grid 19.3 de base et autoupgrade.jar
        env:
          ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
        run: |
          set -euo pipefail
          scripts/fetch_base.sh --repo "$BASE_IMAGES_REPO" \
            --path "oracle/19.3/LINUX.X64_193000_grid_home.zip" \
            --dest "$JOB_ROOT/base/LINUX.X64_193000_grid_home.zip"
          scripts/fetch_base.sh --repo "$TOOLS_REPO" \
            --path "autoupgrade/${{ vars.AUTOUPGRADE_VERSION }}/autoupgrade.jar" \
            --dest "$JOB_ROOT/tools/autoupgrade.jar"

      # OCW télécharge le Grid Infrastructure Release Update correspondant au RU résolu.
      # gold_image=NO : on veut les zips bruts, seuls le GI RU et OPatch atterrissent ici, ce qui
      # permet à build_grid.sh d'identifier le RU sans numéro.
      - name: Télécharger les patches Grid (AutoUpgrade, mot-clé OCW)
        env:
          MOS_USER: ${{ secrets.MOS_USER }}
          MOS_PASS: ${{ secrets.MOS_PASS }}
        run: |
          set -euo pipefail
          sed -e "s|@@PATCH_DIR@@|$JOB_ROOT/patches|" \
              -e "s|@@LOG_DIR@@|$JOB_ROOT/logs|" \
              -e "s|@@KEYSTORE@@|$JOB_ROOT/keystore|" \
              config/autoupgrade-grid.cfg > "$JOB_ROOT/patch.cfg"
          cat "$JOB_ROOT/patch.cfg"
          scripts/mos_keystore.sh \
            --jar "$JOB_ROOT/tools/autoupgrade.jar" \
            --config "$JOB_ROOT/patch.cfg" \
            --keystore "$JOB_ROOT/keystore"
          java -jar "$JOB_ROOT/tools/autoupgrade.jar" -version
          java -jar "$JOB_ROOT/tools/autoupgrade.jar" -config "$JOB_ROOT/patch.cfg" -patch -mode download
          find "$JOB_ROOT/patches" -type f -exec ls -lh {} +

      - name: Construire le Grid home patché et le gold image
        run: |
          set -euo pipefail
          scripts/build_grid.sh \
            --base-zip "$JOB_ROOT/base/LINUX.X64_193000_grid_home.zip" \
            --grid-home "$GRID_HOME" \
            --patch-dir "$JOB_ROOT/patches" \
            --rsp config/grid_swonly.rsp \
            --gold-dir "$JOB_ROOT/gold" \
            --gold-name "gi_${MRP_LABEL}.zip"

      - name: Version construite
        id: built
        run: |
          set -euo pipefail
          VERSION=$(tr -d '[:space:]' < "$JOB_ROOT/gold/version.txt")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ru=$(echo "$VERSION" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"

      - name: Vérifier le gold image et produire le manifeste
        run: |
          set -euo pipefail
          scripts/verify_gold_image.sh \
            --zip "$JOB_ROOT/gold/gi_${MRP_LABEL}.zip" \
            --type grid \
            --mrp "${MRP_LABEL}" \
            --lspatches "$JOB_ROOT/gold/lspatches.txt" \
            --version-file "$JOB_ROOT/gold/version.txt" \
            --base-source "artifactory-19.3-zip" \
            --base-sha256 "$(sha256sum "$JOB_ROOT/base/LINUX.X64_193000_grid_home.zip" | awk '{print $1}')" \
            --container-tag "$CONTAINER_TAG" \
            --out "$JOB_ROOT/gold/gi_${MRP_LABEL}.manifest.json"

      - name: Publier dans Artifactory
        env:
          ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
          FORCE: ${{ inputs.force }}
          RU: ${{ steps.built.outputs.ru }}
        run: |
          set -euo pipefail
          BASE="grid/19/${RU}/gi_${MRP_LABEL}"
          PROPS="type=ORACLEGISOFTWARE;ru=${RU};mrp=${MRP_LABEL};commit=$GITHUB_SHA;run=$GITHUB_RUN_ID"
          scripts/publish_artifactory.sh "$JOB_ROOT/gold/gi_${MRP_LABEL}.zip"           "$BASE.zip"           "$PROPS"
          scripts/publish_artifactory.sh "$JOB_ROOT/gold/lspatches.txt"                 "$BASE.lspatches.txt" "$PROPS"
          scripts/publish_artifactory.sh "$JOB_ROOT/gold/gi_${MRP_LABEL}.manifest.json" "$BASE.manifest.json" "$PROPS"

      - name: Résumé Grid
        env:
          RU: ${{ steps.built.outputs.ru }}
          VERSION: ${{ steps.built.outputs.version }}
        run: |
          set -euo pipefail
          SHA=$(sha256sum "$JOB_ROOT/gold/gi_${MRP_LABEL}.zip" | awk '{print $1}')
          {
            echo "### Grid — gi_${MRP_LABEL}.zip"
            echo "- version construite : \`$VERSION\`"
            echo "- URL : $ARTIFACTORY_URL/$ARTIFACTORY_REPO/grid/19/${RU}/gi_${MRP_LABEL}.zip"
            echo "- sha256 : \`$SHA\`"
            echo '```bash'
            echo "rhpctl import image -image gi_$(echo "$MRP_LABEL" | tr . _) \\"
            echo "  -zip /fpp/staging/gi_${MRP_LABEL}.zip -imagetype ORACLEGISOFTWARE -series gi19"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Espace disque (après)
        if: always()
        run: df -h /u01

  summary:
    needs: [build-rdbms, build-grid]
    if: always()
    runs-on: [self-hosted, linux, oracle-build]
    steps:
      # Aucun RU n'étant déclaré en entrée, le contrôle qui compte est que les deux images
      # aient été construites au même Release Update.
      - name: Résultat et contrôle croisé des versions
        env:
          DB_RESULT: ${{ needs.build-rdbms.result }}
          GI_RESULT: ${{ needs.build-grid.result }}
          DB_VERSION: ${{ needs.build-rdbms.outputs.version }}
          GI_VERSION: ${{ needs.build-grid.outputs.version }}
          MRP_LABEL: ${{ inputs.mrp_label }}
        run: |
          set -uo pipefail
          {
            echo "## Gold images ${MRP_LABEL}"
            echo "| Image | Résultat | Version |"
            echo "| --- | --- | --- |"
            echo "| RDBMS | ${DB_RESULT} | ${DB_VERSION:-—} |"
            echo "| Grid  | ${GI_RESULT} | ${GI_VERSION:-—} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -n "$DB_VERSION" && -n "$GI_VERSION" && "$DB_VERSION" != "$GI_VERSION" ]]; then
            echo "**Versions divergentes : ne pas importer ces images dans FPP.**" >> "$GITHUB_STEP_SUMMARY"
            echo "ERREUR : RDBMS=$DB_VERSION, Grid=$GI_VERSION" >&2
            exit 1
          fi
          [[ "$DB_RESULT" == "failure" || "$GI_RESULT" == "failure" ]] && exit 1
          exit 0
