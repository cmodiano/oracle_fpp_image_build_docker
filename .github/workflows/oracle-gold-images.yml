name: Oracle 19c gold images (RDBMS + Grid)

on:
  workflow_dispatch:
    inputs:
      ru_version:
        description: "Release Update cible (ex. 19.28)"
        required: true
      mrp_label:
        description: "Libellé MRP (ex. 19.28.0.0.250915) — sert au nommage"
        required: true
      gi_ru_patch:
        description: "Numéro du patch GI Release Update (ex. 38xxxxxx)"
        required: true
      db_ru_patch:
        description: "Numéro du patch DB Release Update (ex. 38xxxxxx)"
        required: true
      opatch_patch:
        description: "Numéro du patch OPatch"
        required: false
        default: "6880880"
      gi_oneoffs:
        description: "One-offs GI séparés par des virgules (optionnel)"
        required: false
        default: ""
      db_oneoffs:
        description: "One-offs DB : 'auto' = tout ce qu'AutoUpgrade a téléchargé hors RU/OPatch"
        required: false
        default: "auto"
      build_rdbms:
        type: boolean
        default: true
      build_grid:
        type: boolean
        default: true
      force:
        description: "Écraser une image déjà publiée dans Artifactory"
        type: boolean
        default: false
  # Déclenchement mensuel possible plus tard (cron) : il faudra alors un job
  # "resolve" qui dérive ru/mrp/numéros de patch automatiquement.

concurrency:
  group: oracle-gold-${{ inputs.mrp_label }}
  cancel-in-progress: false

env:
  ARTIFACTORY_URL: ${{ vars.ARTIFACTORY_URL }}      # ex. https://artifactory.example.com/artifactory
  ARTIFACTORY_REPO: ${{ vars.ARTIFACTORY_REPO }}    # dépôt Generic des gold images
  BASE_IMAGES_REPO: ${{ vars.BASE_IMAGES_REPO }}    # dépôt des zips 19.3 de base
  TOOLS_REPO: ${{ vars.TOOLS_REPO }}                # dépôt de autoupgrade.jar
  CONTAINER_TAG: ${{ vars.CONTAINER_REGISTRY }}/dbops/oracle-build-base:ubi8-19c
  WORK_ROOT: /u01/gha

jobs:
  build-rdbms:
    if: ${{ inputs.build_rdbms }}
    runs-on: [self-hosted, linux, oracle-build]
    timeout-minutes: 180
    container:
      image: ${{ vars.CONTAINER_REGISTRY }}/dbops/oracle-build-base:ubi8-19c
      credentials:
        username: ${{ vars.ARTIFACTORY_USER }}
        password: ${{ secrets.ARTIFACTORY_TOKEN }}
      options: --user 54321:54321
      volumes:
        - /u01/gha:/u01/gha
        - /u01/gha/autoupgrade:/u01/gha/autoupgrade:ro   # keystore MOS provisionné sur le runner
    env:
      RU_VERSION: ${{ inputs.ru_version }}
      MRP_LABEL: ${{ inputs.mrp_label }}
      DB_RU_PATCH: ${{ inputs.db_ru_patch }}
      DB_ONEOFFS: ${{ inputs.db_oneoffs }}
      ORACLE_BASE: /u01/app/oracle
      ORACLE_HOME: /u01/app/oracle/product/19.0.0/dbhome_1
      JOB_ROOT: /u01/gha/rdbms
      AU_HOME: /u01/gha/autoupgrade
    steps:
      - uses: actions/checkout@v4

      - name: Espace disque (avant)
        run: df -h /u01/gha

      - name: Préparer l'espace de travail
        run: |
          set -euo pipefail
          sudo /usr/local/sbin/oracle-build-cleanup "$JOB_ROOT" "$ORACLE_HOME"
          mkdir -p "$JOB_ROOT/patches" "$JOB_ROOT/gold" "$JOB_ROOT/logs" "$JOB_ROOT/base" "$JOB_ROOT/tools"

      - name: Récupérer le zip DB 19.3 de base
        env:
          ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
        run: |
          set -euo pipefail
          scripts/fetch_base.sh --repo "$BASE_IMAGES_REPO" \
            --path "oracle/19.3/LINUX.X64_193000_db_home.zip" \
            --dest "$JOB_ROOT/base/LINUX.X64_193000_db_home.zip"

      - name: Récupérer autoupgrade.jar
        env:
          ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
        run: |
          set -euo pipefail
          scripts/fetch_base.sh --repo "$TOOLS_REPO" \
            --path "autoupgrade/${{ vars.AUTOUPGRADE_VERSION }}/autoupgrade.jar" \
            --dest "$JOB_ROOT/tools/autoupgrade.jar"

      - name: Générer la config AutoUpgrade
        run: |
          set -euo pipefail
          sed -e "s|@@PATCH_DIR@@|$JOB_ROOT/patches|" \
              -e "s|@@LOG_DIR@@|$JOB_ROOT/logs|" \
              -e "s|@@KEYSTORE@@|$AU_HOME/keystore|" \
              -e "s|@@RU_VERSION@@|${RU_VERSION}|" \
              config/autoupgrade-patch.cfg > "$JOB_ROOT/patch.cfg"
          cat "$JOB_ROOT/patch.cfg"

      # Le keystore MOS est provisionné une fois sur le runner (voir README) :
      # aucun identifiant MOS ne transite par le workflow pour le RDBMS.
      - name: Télécharger les patches (AutoUpgrade -mode download)
        run: |
          set -euo pipefail
          scripts/autoupgrade_download.sh \
            --jar "$JOB_ROOT/tools/autoupgrade.jar" \
            --config "$JOB_ROOT/patch.cfg" \
            --patch-dir "$JOB_ROOT/patches" \
            --ru-patch "${DB_RU_PATCH}"

      - name: Construire le home patché et le gold image
        run: |
          set -euo pipefail
          scripts/build_rdbms.sh \
            --base-zip "$JOB_ROOT/base/LINUX.X64_193000_db_home.zip" \
            --oracle-home "$ORACLE_HOME" \
            --oracle-base "$ORACLE_BASE" \
            --patch-dir "$JOB_ROOT/patches" \
            --ru-patch "${DB_RU_PATCH}" \
            --oneoffs "${DB_ONEOFFS}" \
            --rsp config/db_swonly.rsp \
            --gold-dir "$JOB_ROOT/gold" \
            --gold-name "db_${MRP_LABEL}.zip"

      - name: Vérifier le gold image et produire le manifeste
        run: |
          set -euo pipefail
          scripts/verify_gold_image.sh \
            --zip "$JOB_ROOT/gold/db_${MRP_LABEL}.zip" \
            --type rdbms \
            --ru "${RU_VERSION}" \
            --mrp "${MRP_LABEL}" \
            --lspatches "$JOB_ROOT/gold/lspatches.txt" \
            --version-file "$JOB_ROOT/gold/version.txt" \
            --base-sha256 "$(sha256sum "$JOB_ROOT/base/LINUX.X64_193000_db_home.zip" | awk '{print $1}')" \
            --container-tag "$CONTAINER_TAG" \
            --out "$JOB_ROOT/gold/db_${MRP_LABEL}.manifest.json"

      - name: Publier dans Artifactory
        env:
          ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          BASE="rdbms/19/${RU_VERSION}/db_${MRP_LABEL}"
          PROPS="type=ORACLEDBSOFTWARE;ru=${RU_VERSION};mrp=${MRP_LABEL};commit=$GITHUB_SHA;run=$GITHUB_RUN_ID"
          scripts/publish_artifactory.sh "$JOB_ROOT/gold/db_${MRP_LABEL}.zip"           "$BASE.zip"           "$PROPS"
          scripts/publish_artifactory.sh "$JOB_ROOT/gold/lspatches.txt"                            "$BASE.lspatches.txt" "$PROPS"
          scripts/publish_artifactory.sh "$JOB_ROOT/gold/db_${MRP_LABEL}.manifest.json" "$BASE.manifest.json" "$PROPS"

      - name: Résumé RDBMS
        run: |
          set -euo pipefail
          SHA=$(sha256sum "$JOB_ROOT/gold/db_${MRP_LABEL}.zip" | awk '{print $1}')
          {
            echo "### RDBMS — db_${MRP_LABEL}.zip"
            echo "- URL : $ARTIFACTORY_URL/$ARTIFACTORY_REPO/rdbms/19/${RU_VERSION}/db_${MRP_LABEL}.zip"
            echo "- sha256 : \`$SHA\`"
            echo '```bash'
            echo "rhpctl import image -image db_$(echo "$MRP_LABEL" | tr . _) \\"
            echo "  -zip /fpp/staging/db_${MRP_LABEL}.zip -imagetype ORACLEDBSOFTWARE -series db19"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Nettoyage
        if: always()
        run: |
          "$ORACLE_HOME/oui/bin/runInstaller" -silent -detachHome ORACLE_HOME="$ORACLE_HOME" || true
          sudo /usr/local/sbin/oracle-build-cleanup "$ORACLE_HOME" "$JOB_ROOT" || true
          df -h /u01/gha

  build-grid:
    if: ${{ inputs.build_grid }}
    runs-on: [self-hosted, linux, oracle-build]
    timeout-minutes: 180
    container:
      image: ${{ vars.CONTAINER_REGISTRY }}/dbops/oracle-build-base:ubi8-19c
      credentials:
        username: ${{ vars.ARTIFACTORY_USER }}
        password: ${{ secrets.ARTIFACTORY_TOKEN }}
      options: --user 54322:54321
      volumes:
        - /u01/gha:/u01/gha
    env:
      RU_VERSION: ${{ inputs.ru_version }}
      MRP_LABEL: ${{ inputs.mrp_label }}
      GI_RU_PATCH: ${{ inputs.gi_ru_patch }}
      OPATCH_PATCH: ${{ inputs.opatch_patch }}
      GI_ONEOFFS: ${{ inputs.gi_oneoffs }}
      GRID_HOME: /u01/app/19.0.0/grid
      JOB_ROOT: /u01/gha/grid
    steps:
      - uses: actions/checkout@v4

      - name: Espace disque (avant)
        run: df -h /u01/gha

      - name: Préparer l'espace de travail
        run: |
          set -euo pipefail
          sudo /usr/local/sbin/oracle-build-cleanup "$JOB_ROOT" "$GRID_HOME"
          mkdir -p "$JOB_ROOT/patches" "$JOB_ROOT/gold" "$JOB_ROOT/base" "$JOB_ROOT/tools"

      - name: Récupérer le zip Grid 19.3 de base
        env:
          ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
        run: |
          set -euo pipefail
          scripts/fetch_base.sh --repo "$BASE_IMAGES_REPO" \
            --path "oracle/19.3/LINUX.X64_193000_grid_home.zip" \
            --dest "$JOB_ROOT/base/LINUX.X64_193000_grid_home.zip"

      - name: Récupérer getMOSPatch.jar
        env:
          ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
        run: |
          set -euo pipefail
          scripts/fetch_base.sh --repo "$TOOLS_REPO" \
            --path "getmospatch/getMOSPatch.jar" \
            --dest "$JOB_ROOT/tools/getMOSPatch.jar"

      - name: Télécharger les patches GI depuis MOS
        env:
          MOS_USER: ${{ secrets.MOS_USER }}
          MOS_PASS: ${{ secrets.MOS_PASS }}
          GETMOS_JAR: /u01/gha/grid/tools/getMOSPatch.jar
        run: |
          set -euo pipefail
          IFS=',' read -ra OO <<< "$GI_ONEOFFS"
          scripts/mos_download.sh "$JOB_ROOT/patches" \
            "$GI_RU_PATCH" "$OPATCH_PATCH" "${OO[@]}"

      - name: Construire le Grid home patché et le gold image
        run: |
          set -euo pipefail
          scripts/build_grid.sh \
            --base-zip "$JOB_ROOT/base/LINUX.X64_193000_grid_home.zip" \
            --grid-home "$GRID_HOME" \
            --patch-dir "$JOB_ROOT/patches" \
            --ru-patch "${GI_RU_PATCH}" \
            --oneoffs "${GI_ONEOFFS}" \
            --rsp config/grid_swonly.rsp \
            --gold-dir "$JOB_ROOT/gold" \
            --gold-name "gi_${MRP_LABEL}.zip"

      - name: Vérifier le gold image et produire le manifeste
        run: |
          set -euo pipefail
          scripts/verify_gold_image.sh \
            --zip "$JOB_ROOT/gold/gi_${MRP_LABEL}.zip" \
            --type grid \
            --ru "${RU_VERSION}" \
            --mrp "${MRP_LABEL}" \
            --lspatches "$JOB_ROOT/gold/lspatches.txt" \
            --version-file "$JOB_ROOT/gold/version.txt" \
            --base-sha256 "$(sha256sum "$JOB_ROOT/base/LINUX.X64_193000_grid_home.zip" | awk '{print $1}')" \
            --container-tag "$CONTAINER_TAG" \
            --out "$JOB_ROOT/gold/gi_${MRP_LABEL}.manifest.json"

      - name: Publier dans Artifactory
        env:
          ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          BASE="grid/19/${RU_VERSION}/gi_${MRP_LABEL}"
          PROPS="type=ORACLEGISOFTWARE;ru=${RU_VERSION};mrp=${MRP_LABEL};commit=$GITHUB_SHA;run=$GITHUB_RUN_ID"
          scripts/publish_artifactory.sh "$JOB_ROOT/gold/gi_${MRP_LABEL}.zip"           "$BASE.zip"           "$PROPS"
          scripts/publish_artifactory.sh "$JOB_ROOT/gold/lspatches.txt"                            "$BASE.lspatches.txt" "$PROPS"
          scripts/publish_artifactory.sh "$JOB_ROOT/gold/gi_${MRP_LABEL}.manifest.json" "$BASE.manifest.json" "$PROPS"

      - name: Résumé Grid
        run: |
          set -euo pipefail
          SHA=$(sha256sum "$JOB_ROOT/gold/gi_${MRP_LABEL}.zip" | awk '{print $1}')
          {
            echo "### Grid — gi_${MRP_LABEL}.zip"
            echo "- URL : $ARTIFACTORY_URL/$ARTIFACTORY_REPO/grid/19/${RU_VERSION}/gi_${MRP_LABEL}.zip"
            echo "- sha256 : \`$SHA\`"
            echo '```bash'
            echo "rhpctl import image -image gi_$(echo "$MRP_LABEL" | tr . _) \\"
            echo "  -zip /fpp/staging/gi_${MRP_LABEL}.zip -imagetype ORACLEGISOFTWARE -series gi19"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Nettoyage
        if: always()
        run: |
          "$GRID_HOME/oui/bin/runInstaller" -silent -detachHome ORACLE_HOME="$GRID_HOME" || true
          sudo /usr/local/sbin/oracle-build-cleanup "$GRID_HOME" "$JOB_ROOT" || true
          df -h /u01/gha

  summary:
    needs: [build-rdbms, build-grid]
    if: always()
    runs-on: [self-hosted, linux, oracle-build]
    env:
      RU_VERSION: ${{ inputs.ru_version }}
      MRP_LABEL: ${{ inputs.mrp_label }}
    steps:
      - name: Résultat
        run: |
          {
            echo "## Gold images ${MRP_LABEL}"
            echo "| Image | Résultat |"
            echo "| --- | --- |"
            echo "| RDBMS | ${{ needs.build-rdbms.result }} |"
            echo "| Grid  | ${{ needs.build-grid.result }} |"
            echo ""
            echo "Artifactory : \`$ARTIFACTORY_REPO/{rdbms,grid}/19/${RU_VERSION}/\`"
          } >> "$GITHUB_STEP_SUMMARY"
