# AutoUpgrade — téléchargement des patches Grid Infrastructure.
#
# AutoUpgrade n'installe ni ne patche aucun home Grid : c'est gridSetup.sh -applyRU qui le fait.
# En revanche le mot-clé OCW télécharge, en mode download, le Grid Infrastructure Release Update
# correspondant au RU résolu — aucun numéro ni version à saisir.
#
# gold_image=NO est indispensable ici : on veut les zips de patch bruts à passer à gridSetup,
# pas une image déjà assemblée. Le dossier ne contient donc que le GI RU et OPatch, ce qui permet
# de désigner le RU sans le nommer : c'est le seul zip qui n'est pas p6880880.
#
# Les @@...@@ sont substitués par le workflow.
global.global_log_dir=@@LOG_DIR@@
global.keystore=@@KEYSTORE@@

patch1.platform=LINUX.X64
patch1.target_version=19
patch1.folder=@@PATCH_DIR@@
patch1.download=yes

patch1.gold_image=NO
patch1.patch=OCW,OPATCH
