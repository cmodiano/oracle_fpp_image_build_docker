# Config AutoUpgrade — mode patching, téléchargement seul.
# AutoUpgrade ne crée aucun home ici : source_home/target_home sont volontairement absents,
# les homes sont construits par runInstaller/gridSetup avec -applyRU.
# Les @@...@@ sont substitués par le workflow.
global.global_log_dir=@@LOG_DIR@@
global.keystore=@@KEYSTORE@@

patch1.platform=LINUX.X64
patch1.target_version=19

# Dossier de téléchargement / staging des patches
patch1.folder=@@PATCH_DIR@@
patch1.download=yes

# gold_image vaut AUTO par défaut : AutoUpgrade demanderait alors à l'Oracle Update Advisor une
# gold image déjà patchée au lieu des zips de patches, ce qui contredit le patching par l'installeur
# et casserait le contrôle de présence du RU dans scripts/autoupgrade_download.sh. Fixé à NO.
patch1.gold_image=NO

# RECOMMENDED = dernier RU + MRP + OPatch + OJVM/DPBP selon disponibilité.
# Pour figer explicitement : patch1.patch=RU:@@RU_VERSION@@,MRP,OPATCH,OJVM
patch1.patch=RECOMMENDED
