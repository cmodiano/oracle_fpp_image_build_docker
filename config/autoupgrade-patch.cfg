# Config AutoUpgrade — construction d'un ORACLE_HOME 19c patché, sans numéro de patch ni home source.
#
# gold_image=ALL : AutoUpgrade demande à l'Oracle Update Advisor une gold image contenant le RU et
# les one-offs recommandés, la télécharge et l'extrait dans target_home. C'est ce qui rend inutiles
# le zip 19.3 de base (exigé seulement quand gold_image=NO) et tout numéro de patch côté RDBMS.
# Le mode create_home n'exécute que EXTRACT, DBTOOLS, INSTALL, ROOH, OH_PATCHING, OPTIONS, ROOTSH :
# aucune étape base de données, donc ni sid ni source_home.
#
# Les @@...@@ sont substitués par le workflow.
global.global_log_dir=@@LOG_DIR@@
global.keystore=@@KEYSTORE@@

patch1.platform=LINUX.X64
patch1.target_version=19

# Staging des téléchargements
patch1.folder=@@PATCH_DIR@@
patch1.download=yes

# ALL = gold image incluant RU, MRP, OJVM/DPBP et one-offs recommandés.
# YES exclurait les one-offs, NO exigerait le zip 19.3 de base dans patch1.folder.
patch1.gold_image=ALL
patch1.patch=RECOMMENDED

# Home cible et zip de gold image produit par AutoUpgrade
patch1.method=outofplace
patch1.target_home=@@TARGET_HOME@@
patch1.create_gold_image=@@GOLD_ZIP@@
